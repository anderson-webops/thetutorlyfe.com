[build]
publish = "front-end/.output/public"
command = "npm run build:netlify"

[build.environment]
NODE_VERSION = "24.18.1"
NPM_VERSION = "12.0.2"
NPM_FLAGS = "--include=optional"

[functions]
directory = "netlify/functions"
external_node_modules = ["express", "express-rate-limit", "helmet", "serverless-http"]
node_bundler = "esbuild"

[[redirects]]
from = "/healthz"
to = "/.netlify/functions/api/healthz"
status = 200
force = true

[[redirects]]
from = "/readyz"
to = "/.netlify/functions/api/readyz"
status = 200
force = true

[[redirects]]
from = "/api/leads"
to = "/.netlify/functions/api/leads"
status = 200
force = true

  [redirects.rate_limit]
  window_limit = 6
  window_size = 180
  aggregate_by = ["ip", "domain"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "base-uri 'none'; frame-ancestors 'none'; object-src 'none'"
  Cross-Origin-Embedder-Policy = "require-corp"
  Cross-Origin-Opener-Policy = "same-origin"
  Cross-Origin-Resource-Policy = "same-origin"
  Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), web-share=(), xr-spatial-tracking=()"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"

[[headers]]
for = "/_nuxt/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
