name: Validate and publish The Tutor Lyfe direct release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: direct-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Prepare exact tagged source runtime
        env:
          CI: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
          BUILD_ROOT="$(dirname "$GITHUB_WORKSPACE")" \
          NODE_BIN_DIR="$(dirname "$(command -v node)")" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache" \
          deploy/systemd/prepare-release.sh "$GITHUB_WORKSPACE"

  artifact:
    name: Validate and publish Linux ARM64 artifact
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write # Create the matching release and upload accepted assets.
    steps:
      - name: Check out tagged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Prepare isolated artifact tools
        # zizmor: ignore[adhoc-packages]
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          "$bin/node" scripts/check-build-toolchain.mjs
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor python3-minimal
          sudo install -D -m 0755 /usr/bin/bwrap /opt/tutorlyfe-test-tools/bwrap
          if test -d /sys/kernel/security/apparmor; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile tutorlyfe-artifact-tests /opt/tutorlyfe-test-tools/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/tutorlyfe-artifact-tests >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/tutorlyfe-artifact-tests
          fi
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"

      - name: Validate source and exact production artifact
        env:
          CI: "true"
          NUXT_TELEMETRY_DISABLED: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
        run: |
          bash scripts/prepare-unimport-source.sh
          npm ci --include=optional --strict-allow-scripts
          bash scripts/prepare-compiler-fixtures.sh
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures
          npm run validate
          PATH="/opt/tutorlyfe-test-tools:$PATH" npm run test:promotion
          mkdir -p .ai-work/runs/tagged-artifact
          PATH="/opt/tutorlyfe-test-tools:$PATH" npm run package:runtime -- "$PWD/.ai-work/runs/tagged-artifact"

          python3 -B - .ai-work/runs/tagged-artifact "$(git rev-parse HEAD)" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          commit = sys.argv[2]
          receipt_path, = output.glob("thetutorlyfe-com-*-acceptance.json")
          manifest_path, = output.glob("thetutorlyfe-com-*-runtime-manifest.json")
          receipt = json.loads(receipt_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          contract = json.loads(Path("deploy/runtime-artifact.json").read_text())
          archive = output / receipt["archive"]
          assert receipt["commit"] == manifest["commit"] == commit
          assert receipt["sha256"] == hashlib.sha256(archive.read_bytes()).hexdigest()
          assert manifest["contract"] == contract
          assert receipt["buildToolchain"]["profile"] == contract["runtime"]["npmBuildProfile"]
          assert receipt["buildToolchain"]["lockSha256"] == contract["runtime"]["npmBuildLockSha256"]
          assert receipt["buildToolchain"]["payloadTreeSha256"] == contract["runtime"]["npmBuildPayloadSha256"]
          assert hashlib.sha256(Path("build-toolchain/package-lock.json").read_bytes()).hexdigest() == contract["runtime"]["npmBuildLockSha256"]
          assert contract["deployment"]["schemaVersion"] == 1
          assert contract["deployment"]["applicationId"] == "thetutorlyfe.com"
          PY

      - name: Preserve accepted runtime assets as workflow evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thetutorlyfe-${{ github.ref_name }}-linux-arm64-runtime
          path: |
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*.tar.gz
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*-SHA256SUMS
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*-runtime-manifest.json
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*-acceptance.json
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*-dependency-tree.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the accepted immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t archives < <(find .ai-work/runs/tagged-artifact -maxdepth 1 -type f -name 'thetutorlyfe-com-*.tar.gz' -print)
          mapfile -t checksums < <(find .ai-work/runs/tagged-artifact -maxdepth 1 -type f -name 'thetutorlyfe-com-*-SHA256SUMS' -print)
          mapfile -t manifests < <(find .ai-work/runs/tagged-artifact -maxdepth 1 -type f -name 'thetutorlyfe-com-*-runtime-manifest.json' -print)
          mapfile -t receipts < <(find .ai-work/runs/tagged-artifact -maxdepth 1 -type f -name 'thetutorlyfe-com-*-acceptance.json' -print)
          test "${#archives[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          test "${#receipts[@]}" -eq 1
          assets=(
            "${archives[0]}"
            "${checksums[0]}"
            "${manifests[0]}"
            "${receipts[0]}"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable assets will not be replaced." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "The Tutor Lyfe $RELEASE_TAG" \
            --notes "Validated source release with a closed, sterile-tested Linux ARM64 direct-runtime artifact. Production deployment is separate."
