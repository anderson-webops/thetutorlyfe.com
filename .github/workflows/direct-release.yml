name: Validate and publish The Tutor Lyfe direct release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: direct-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Pin npm without checkout credentials
        # Node 24.18.1 does not bundle the required security-patched npm 12.0.2.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global npm@12.0.2 --allow-scripts=npm
          node --version
          npm --version

      - name: Prepare exact tagged source runtime
        env:
          CI: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
          BUILD_ROOT="$(dirname "$GITHUB_WORKSPACE")" \
          NODE_BIN_DIR="$(dirname "$(command -v node)")" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache" \
          deploy/systemd/prepare-release.sh "$GITHUB_WORKSPACE"

  artifact:
    name: Validate and publish Linux ARM64 artifact
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write # Create the matching release and upload accepted assets.
    steps:
      - name: Check out tagged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Prepare isolated artifact tools
        # Node 24.18.1 does not bundle the required security-patched npm 12.0.2.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global npm@12.0.2 --allow-scripts=npm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor python3-minimal
          if test -d /sys/kernel/security/apparmor; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile tutorlyfe-artifact-tests /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/tutorlyfe-artifact-tests >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/tutorlyfe-artifact-tests
          fi
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"

      - name: Validate source and exact production artifact
        env:
          CI: "true"
          NUXT_TELEMETRY_DISABLED: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
        run: |
          npm ci --include=optional --strict-allow-scripts
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures
          npm run validate
          npm run test:promotion
          mkdir -p .ai-work/runs/tagged-artifact
          npm run package:runtime -- "$PWD/.ai-work/runs/tagged-artifact"

      - name: Preserve accepted runtime assets as workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thetutorlyfe-${{ github.ref_name }}-linux-arm64-runtime
          path: |
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*.tar.gz
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*-SHA256SUMS
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*-runtime-manifest.json
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*-acceptance.json
            .ai-work/runs/tagged-artifact/thetutorlyfe-com-*-dependency-tree.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the accepted immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t archives < <(find .ai-work/runs/tagged-artifact -maxdepth 1 -type f -name 'thetutorlyfe-com-*.tar.gz' -print)
          mapfile -t checksums < <(find .ai-work/runs/tagged-artifact -maxdepth 1 -type f -name 'thetutorlyfe-com-*-SHA256SUMS' -print)
          mapfile -t manifests < <(find .ai-work/runs/tagged-artifact -maxdepth 1 -type f -name 'thetutorlyfe-com-*-runtime-manifest.json' -print)
          mapfile -t receipts < <(find .ai-work/runs/tagged-artifact -maxdepth 1 -type f -name 'thetutorlyfe-com-*-acceptance.json' -print)
          test "${#archives[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          test "${#receipts[@]}" -eq 1
          assets=(
            "${archives[0]}"
            "${checksums[0]}"
            "${manifests[0]}"
            "${receipts[0]}"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable assets will not be replaced." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "The Tutor Lyfe $RELEASE_TAG" \
            --notes "Validated source release with a closed, sterile-tested Linux ARM64 direct-runtime artifact. Production deployment is separate."
