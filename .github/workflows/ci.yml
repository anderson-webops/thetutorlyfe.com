name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26.13.1
  NPM_VERSION: 12.2.2
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  validate:
    name: Validate source and deployment output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare the independent locked build toolchain
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          "$bin/node" scripts/check-build-toolchain.mjs

      - name: Verify the independently rebuilt auto-import compiler
        run: bash scripts/prepare-unimport-source.sh

      - name: Prepare isolated promotion regression tools
        # Ubuntu runners do not guarantee the required user-namespace test tool.
        # zizmor: ignore[adhoc-packages]
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor python3-minimal
          sudo install -D -m 0755 /usr/bin/bwrap /opt/tutorlyfe-test-tools/bwrap
          if test -d /sys/kernel/security/apparmor; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile tutorlyfe-promotion-tests /opt/tutorlyfe-test-tools/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/tutorlyfe-promotion-tests >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/tutorlyfe-promotion-tests
          fi

      - name: Install locked dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Install independent compiler tooling and original-version fixtures
        run: bash scripts/prepare-compiler-fixtures.sh

      - name: Audit development and production dependencies
        run: |
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures

      - name: Validate source and deployment output
        run: npm run validate

      - name: Exercise protected promotion and rollback
        run: PATH="/opt/tutorlyfe-test-tools:$PATH" npm run test:promotion

      - name: Run browser and accessibility checks
        run: |
          npm run a11y
          npm run test:jsx-browser
          npm run test:router-browser
          npm run test:remove-host
          npm run test:magicast-browser
          npm run test:vue-compiler-browser
          npm run test:checker-browser
          npm run test:rollup-browser
          npm run test:nitro-tools-browser
          npm run test:nuxt-watcher-browser
          npm run test:framework-browser
