name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  validate:
    name: Validate source and deployment output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Align npm with the repository policy
        # Node 24.18.1 does not bundle the required security-patched npm 12.0.2.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global "npm@${NPM_VERSION}" --allow-scripts=npm
          node --version
          npm --version

      - name: Prepare isolated promotion regression tools
        # Ubuntu runners do not guarantee the required user-namespace test tool.
        # zizmor: ignore[adhoc-packages]
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor python3-minimal
          if test -d /sys/kernel/security/apparmor; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile tutorlyfe-promotion-tests /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/tutorlyfe-promotion-tests >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/tutorlyfe-promotion-tests
          fi

      - name: Install locked dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Audit development and production dependencies
        run: |
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures

      - name: Validate source and deployment output
        run: npm run validate

      - name: Exercise protected promotion and rollback
        run: npm run test:promotion

      - name: Run accessibility smoke checks
        run: npm run a11y
